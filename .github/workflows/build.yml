name: ROS build and regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  ros1:
    runs-on: ubuntu-latest
    container: ros:noetic-ros-base-focal
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          apt-get update
          apt-get install -y python3-pip libeigen3-dev
          pip3 install cmake==3.28.4
          rosdep update --rosdistro noetic --include-eol-distros
          rosdep install --from-paths ros1/src --ignore-src --rosdistro noetic -r -y
      - name: Build
        run: bash scripts/build.sh ros1
      - name: Regression and synthetic pipeline
        run: bash scripts/test.sh ros1
  ros2:
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-base-noble
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          apt-get update
          apt-get install -y libeigen3-dev python3-colcon-common-extensions
          rosdep update --rosdistro jazzy
          rosdep install --from-paths ros2/src --ignore-src --rosdistro jazzy -r -y
      - name: Build
        run: bash scripts/build.sh ros2
      - name: Regression and synthetic pipeline
        run: bash scripts/test.sh ros2
